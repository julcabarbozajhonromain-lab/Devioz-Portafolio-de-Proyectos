<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Flujo de ingenieria digital Devioz</title>
  <desc id="desc">Ilustracion de producto, arquitectura, inteligencia artificial y calidad conectados en un flujo de desarrollo.</desc>
  <defs>
