    <linearGradient id="mint" x1="332" y1="196" x2="598" y2="568" gradientUnits="userSpaceOnUse"><stop stop-color="#B5F3DC"/><stop offset="1" stop-color="#57D2AD"/></linearGradient>
    <linearGradient id="violet" x1="672" y1="148" x2="824" y2="270" gradientUnits="userSpaceOnUse"><stop stop-color="#D9D4FF"/><stop offset="1" stop-color="#9E92FF"/></linearGradient>
