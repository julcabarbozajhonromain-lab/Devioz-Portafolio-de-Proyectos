    <circle cx="319" cy="553" r="5" fill="#14A982"/><text x="332" y="557" fill="#4D6375" font-family="Arial,sans-serif" font-size="10" font-weight="700">Personas + tecnologia + resultados</text>
    <text x="310" y="578" fill="#8A99A8" font-family="Arial,sans-serif" font-size="8">FLUJO ADAPTABLE A CADA RETO</text>
