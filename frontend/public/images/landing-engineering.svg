    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.5" fill="#D5F8EF" fill-opacity=".24"/></pattern>
  </defs>
  <rect x="20" y="20" width="920" height="680" rx="36" fill="url(#bg)"/>
