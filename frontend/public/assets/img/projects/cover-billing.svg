<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="120" cy="100" r="160" fill="#3b82f6" opacity="0.08"/>
  <circle cx="720" cy="360" r="180" fill="#10b981" opacity="0.08"/>

  <!-- Code / API Frame -->
  <g transform="translate(180, 70)">
    <rect width="440" height="280" rx="14" fill="#09090b" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <rect width="440" height="36" rx="14" fill="#18181b"/>
    <circle cx="20" cy="18" r="5" fill="#ef4444"/>
    <circle cx="36" cy="18" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="18" r="5" fill="#10b981"/>
    <text x="220" y="23" text-anchor="middle" fill="#71717a" font-family="monospace" font-size="12">POST /api/v1/invoice/sign</text>

    <!-- Code Lines -->
    <text x="30" y="75" fill="#10b981" font-family="monospace" font-size="13">&lt;Invoice xmlns="urn:oasis:names:specification:ubl"&gt;</text>
    <text x="50" y="105" fill="#60a5fa" font-family="monospace" font-size="13">&lt;cbc:UBLVersionID&gt;<tspan fill="#f4f4f5">2.1</tspan>&lt;/cbc:UBLVersionID&gt;</text>
    <text x="50" y="135" fill="#60a5fa" font-family="monospace" font-size="13">&lt;cac:Signature&gt;</text>
    <text x="70" y="165" fill="#f59e0b" font-family="monospace" font-size="13">&lt;ds:DigestValue&gt;<tspan fill="#a1a1aa">rA5kL...==</tspan>&lt;/ds:DigestValue&gt;</text>
    <text x="50" y="195" fill="#60a5fa" font-family="monospace" font-size="13">&lt;/cac:Signature&gt;</text>
    <text x="30" y="225" fill="#10b981" font-family="monospace" font-size="13">&lt;/Invoice&gt;</text>

    <!-- 200 OK Badge -->
    <rect x="330" y="230" width="85" height="26" rx="6" fill="#10b981" opacity="0.2"/>
    <text x="372" y="247" text-anchor="middle" fill="#10b981" font-family="monospace" font-weight="bold" font-size="11">HTTP 200 OK</text>
  </g>

  <text x="400" y="395" text-anchor="middle" fill="#f4f4f5" font-family="system-ui, sans-serif" font-weight="700" font-size="20">API DE FACTURACIÓN ELECTRÓNICA</text>
  <text x="400" y="415" text-anchor="middle" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="13">Firma Digital &bull; UBL 2.1 &bull; RESTful Microservices</text>
</svg>
