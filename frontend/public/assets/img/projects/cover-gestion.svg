    <rect x="360" y="123" width="70" height="14" rx="7" fill="#10b981" opacity="0.2"/>
    
    <rect x="25" y="165" width="430" height="40" rx="6" fill="#1f1f23"/>
    <circle cx="50" cy="185" r="10" fill="#10b981" opacity="0.3"/>
