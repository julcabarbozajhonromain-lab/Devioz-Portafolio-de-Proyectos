    <rect x="360" y="178" width="70" height="14" rx="7" fill="#10b981" opacity="0.2"/>
    
    <rect x="25" y="220" width="430" height="40" rx="6" fill="#1f1f23"/>
    <circle cx="50" cy="240" r="10" fill="#f59e0b" opacity="0.3"/>
    <rect x="75" y="236" width="100" height="8" rx="4" fill="#f4f4f5"/>
