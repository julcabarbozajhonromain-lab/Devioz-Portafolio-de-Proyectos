  </g>
  
  <text x="400" y="405" text-anchor="middle" fill="#f4f4f5" font-family="system-ui, sans-serif" font-weight="700" font-size="20">SISTEMA DE GESTIÓN WEB</text>
  <text x="400" y="425" text-anchor="middle" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="13">Control de Inventarios &bull; Kardex &bull; Devioz 24</text>
