    <rect x="140" y="135" width="100" height="10" rx="5" fill="#a855f7"/>
    <rect x="140" y="160" width="280" height="6" rx="3" fill="#71717a"/>
    <rect x="140" y="175" width="240" height="6" rx="3" fill="#71717a"/>
    <rect x="140" y="190" width="260" height="6" rx="3" fill="#71717a"/>
    
    <rect x="140" y="225" width="90" height="30" rx="6" fill="#a855f7"/>
